<!doctype html>
<!--
Source for assets/agent-steroids.png. After editing, regenerate with:

  npx playwright screenshot --viewport-size=1280,440 \
    assets/banner.html assets/agent-steroids.png

Needs network on regeneration: the type pairing loads from Google Fonts.
Palette, type scale and icon style are shared with assets/before-after.html
and assets/speed.html. The stat figures quote measured numbers; check them
against `steroids stats` and the benchmark table in README.md before
changing them.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface:      #080c0e;
    --line:         #1d272c;
    --ink:          #f2f7f8;
    --ink-muted:    #93a3aa;
    --ink-faint:    #758990;
    --accent:       #22d3ee;

    --step: 22px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px;
    height: 440px;
    background: var(--surface);
    color: var(--ink);
    font-family: Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage { text-align: center; }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .22em;
    line-height: 1.25;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: calc(var(--step) * 1.2);
  }

  .wordmark {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -.038em;
    line-height: 1;
    color: var(--ink);
  }

  .tagline {
    margin-top: var(--step);
    font-size: 22px;
    line-height: 1.35;
    color: var(--ink-muted);
  }

  /* Three measured figures, divided by hairlines rather than dressed up as
     badges. The only accent here is the number itself. */
  .stats {
    margin-top: calc(var(--step) * 1.6);
    padding-top: calc(var(--step) * 1.3);
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: center;
  }
  .stat {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 0 26px;
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink-faint);
  }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
  <div class="stage">

    <div class="eyebrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/>
        <path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
      </svg>
      For your coding agent
    </div>

    <div class="wordmark">AGENT STEROIDS</div>

    <div class="tagline">Live code from real repos. On your machine.</div>

    <div class="stats">
      <div class="stat"><b>0</b> rate limits</div>
      <div class="stat"><b>9ms</b> searches</div>
      <div class="stat"><b>100%</b> local</div>
    </div>

  </div>
</body>
</html>
