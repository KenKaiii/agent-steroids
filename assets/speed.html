<!doctype html>
<!--
Source for assets/speed.png. After editing, regenerate with:

  npx playwright screenshot --viewport-size=1280,460 \
    assets/speed.html assets/speed.png

Needs network on regeneration: the type pairing loads from Google Fonts.
Palette and type scale are shared with assets/before-after.html.
Figures must match the benchmark table in README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface:      #080c0e;
    --surface-up:   #0e1417;
    --line:         #1d272c;
    --ink:          #f2f7f8;
    --ink-muted:    #93a3aa;
    --ink-faint:    #758990;
    --accent:       #22d3ee;
    --on-accent:    #04161b;

    --step: 22px;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px;
    height: 460px;
    background: var(--surface);
    color: var(--ink);
    font-family: Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage { width: 1180px; }

  .title {
    font-size: 29px;
    font-weight: 700;
    letter-spacing: -.021em;
    line-height: 1.2;
  }
  .sub {
    margin-top: 8px;
    font-size: 16px;
    line-height: 1.4;
    color: var(--ink-muted);
  }

  .chart {
    margin-top: calc(var(--step) * 1.6);
    padding-top: calc(var(--step) * 1.3);
    border-top: 1px solid var(--line);
  }

  .row { display: flex; align-items: center; }
  .row + .row { margin-top: var(--step); }

  .name {
    width: 236px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--ink-muted);
    padding-right: 20px;
  }
  .name.us { color: var(--ink); }
  .name svg { flex: none; color: var(--ink-faint); }
  .name.us svg { color: var(--accent); }

  .track { flex: 1; display: flex; align-items: center; gap: 18px; }

  .bar {
    height: 38px;
    border-radius: var(--radius);
    background: var(--surface-up);
    border: 1px solid var(--line);
  }
  /* The single accent fill in the image: the number we want read first. */
  .bar.us { background: var(--accent); border-color: var(--accent); }

  .val {
    font-family: "JetBrains Mono", monospace;
    font-size: 18px;
    line-height: 1.25;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .val.us { color: var(--accent); }
  .val small {
    display: block;
    font-size: 13px;
    line-height: 1.3;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .foot {
    margin-top: calc(var(--step) * 1.6);
    padding-top: calc(var(--step) * 1.3);
    border-top: 1px solid var(--line);
    display: flex;
    gap: 40px;
  }
  .claim {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    line-height: 1.25;
    color: var(--ink-muted);
  }
  .claim svg { flex: none; color: var(--accent); }
  .claim b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">

    <div class="title">Your agent wants 30 examples before it writes a function</div>
    <div class="sub">Same searches, same queries, measured the same way.</div>

    <div class="chart">
      <div class="row">
        <div class="name us">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Agent Steroids
        </div>
        <div class="track">
          <div class="bar us" style="width: 24px"></div>
          <div class="val us">0.3 seconds<small>on your own disk</small></div>
        </div>
      </div>

      <div class="row">
        <div class="name">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
          Hosted code search
        </div>
        <div class="track">
          <div class="bar" style="width: 604px"></div>
          <div class="val">1 to 20 minutes<small>if you dodge the rate limit</small></div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="claim">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <span><b>No</b> rate limits</span>
      </div>
      <div class="claim">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <span><b>No</b> API keys</span>
      </div>
      <div class="claim">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <span><b>Works</b> offline</span>
      </div>
    </div>

  </div>
</body>
</html>
