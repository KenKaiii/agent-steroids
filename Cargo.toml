[package]
name = "steroids"
version = "0.1.0"
edition = "2024"
# let-chains (`if let ... && ...`) stabilised here; edition 2024 alone is 1.85.
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
memchr = "2.8.3"
ratatui = "0.30"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tui-input = "0.15"
ureq = "3.4.0"
zstd = "0.13.3"
