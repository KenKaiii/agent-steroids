[package]
name = "steroids"
version = "0.3.1"
edition = "2024"
# Edition 2024 needs 1.85, but ratatui pulls in a `time` that needs 1.88, so
# 1.88 is the real floor whatever our own syntax requires.
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "A local corpus of open-source code, searchable by you or your coding agent"
repository = "https://github.com/KenKaiii/agent-steroids"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.10"
memchr = "2.8.3"
ratatui = "0.30"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 0.10, not 0.11: rusqlite already pulls 0.10.9, so this adds no second copy.
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
tar = "0.4.46"
tui-input = "0.15"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
ureq = "3.4.0"
zstd = "0.13.3"
