name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings

      # Tests needing a populated corpus skip themselves when
      # STEROIDS_TEST_ROOT is unset, which is the case here.
      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # Every command an agent can run, including its failure paths and exit
      # codes. Unit tests cover the engine; this covers the surface.
      - name: Command tests
        run: BIN=./target/release/steroids bash tests/commands.sh
