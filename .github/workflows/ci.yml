name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The smoke path runs real commands; none of them may reach for a release.
  STEROIDS_NO_UPGRADE: 1

jobs:
  # Linux, macOS and Windows all differ in ways this tool cares about: file
  # locking, home directory, and path handling. Building on one and hoping is
  # how a platform quietly breaks.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      - name: First run works
        shell: bash
        run: |
          ./target/release/steroids${{ runner.os == 'Windows' && '.exe' || '' }} --root ci-corpus add antirez/smallchat
          ./target/release/steroids${{ runner.os == 'Windows' && '.exe' || '' }} --root ci-corpus index
          ./target/release/steroids${{ runner.os == 'Windows' && '.exe' || '' }} --root ci-corpus search 'int main' --limit 1
          ./target/release/steroids${{ runner.os == 'Windows' && '.exe' || '' }} --root ci-corpus repos

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings

      # Tests needing a populated corpus skip themselves when
      # STEROIDS_TEST_ROOT is unset, which is the case here.
      - name: Tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # Every command an agent can run, including its failure paths and exit
      # codes. Unit tests cover the engine; this covers the surface.
      - name: Command tests
        run: BIN=./target/release/steroids bash tests/commands.sh

  # The install scripts are what a first-time user runs, with no toolchain to
  # fall back on. Each is exercised for real against the latest release:
  # install, run, and refuse a second identical install.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/steroids" --version
          INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh | grep 'already at'

  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install.ps1
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          ./install.ps1
          & "$env:INSTALL_DIR\steroids.exe" --version
          # Write-Host goes to the information stream, so capture that.
          $second = ./install.ps1 6>&1 | Out-String
          if ($second -notmatch 'already at') { throw "second run was not a no-op:`n$second" }
